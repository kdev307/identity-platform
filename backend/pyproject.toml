[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Dev Kumar", email = "dev.kumar@aurigait.com" }
]
requires-python = ">=3.10"
dependencies = [
    "celery>=5.6.3",
    "django>=5.2.16",
    "django-environ>=0.14.0",
    "djangorestframework>=3.17.1",
    "psycopg[binary]>=3.3.4",
    "redis>=8.1.0",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.12.0",
    "ruff>=0.16.1",
]
